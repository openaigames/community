name: Game catalog and PR preview
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review]
    branches: [main]
  push:
    branches: [main]
    paths: ['demos/**', 'catalog/**', 'tooling/catalog/**', '.github/workflows/catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: catalog-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out or execute the PR head in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: tooling/catalog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata, publish catalog, and update PR preview
        run: node tooling/catalog/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_PUBLISH_URL: ${{ vars.CATALOG_PUBLISH_URL }}
          CATALOG_PUBLISH_SECRET: ${{ secrets.CATALOG_PUBLISH_SECRET }}
